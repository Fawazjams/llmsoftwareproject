<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surveillance.ai · Live Floor</title>
<style>
  :root {
    --ink: #17211c; --muted: #5c564c; --paper: #fffdf8; --paper-2: #f3ecdf; --line: #ddd4c6;
    --copper: #8d3d14; --copper-deep: #6e3012; --good: #145c38; --good-bg: #e5f2ea;
    --warn: #6d4a10; --warn-bg: #f8efd8; --weak: #7a2e2e; --weak-bg: #f8e6e2;
    --serif: "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "Segoe UI", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--sans); color: var(--ink); background: #efe7db; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  .panel {
    position: absolute; z-index: 2; top: 16px; left: 16px; bottom: 16px;
    width: min(400px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 14px;
    padding: 22px; background: rgba(255, 253, 248, 0.95); border: 1px solid rgba(255,255,255,.75);
    border-radius: 20px; box-shadow: 0 18px 50px rgba(20, 24, 20, 0.22); overflow: hidden;
  }
  .brand { display: flex; gap: 12px; align-items: center; }
  .brand-mark {
    width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px;
    background: var(--ink); color: var(--paper); font-family: var(--serif); font-size: 24px;
  }
  .brand strong { display: block; font-family: var(--serif); font-size: 26px; font-weight: 600; line-height: 1; }
  .brand small { color: var(--muted); }
  .live { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
    background: var(--good-bg); color: var(--good); border-radius: 999px; padding: 4px 10px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stat span { display: block; color: var(--muted); font-size: 13px; }
  .stat b { font-family: var(--serif); font-size: 38px; font-weight: 600; line-height: 1.1; }
  .stat.hero { grid-column: span 2; background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .stat.hero span { color: #cfc6b8; }
  .stat.hero b { font-size: 54px; }
  h3 { margin: 4px 0 0; font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .alert { background: var(--weak-bg); color: var(--weak); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .log { flex: 1; overflow-y: auto; background: var(--paper-2); border-radius: 12px; padding: 10px 12px;
    font: 12px/1.6 Consolas, monospace; color: var(--muted); }
  .log div.in { color: var(--good); } .log div.out { color: var(--copper); } .log div.alrt { color: var(--weak); font-weight: 700; }
  .legend { position: absolute; z-index: 2; right: 16px; bottom: 16px; display: flex; gap: 8px; }
  .chip { background: rgba(255,253,248,.95); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; }
  .privacy { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="scene"></div>

<aside class="panel">
  <div class="brand">
    <div class="brand-mark">S</div>
    <div><strong>Surveillance.ai</strong><small>Who's coming, who's leaving</small></div>
    <span class="live"><i></i>Live</span>
  </div>
  <div class="stats">
    <div class="stat hero"><span>Customers in store</span><b id="in_store">0</b></div>
    <div class="stat"><span>Came in</span><b id="came_in">0</b></div>
    <div class="stat"><span>Left</span><b id="left">0</b></div>
    <div class="stat" style="grid-column: span 2"><span>Employees on floor</span><b id="employees">0</b></div>
  </div>
  <div id="alerts"></div>
  <h3>Event log</h3>
  <div class="log" id="log"><div>Waiting for events from main.py…</div></div>
  <div class="privacy">No face recognition. No video saved. Staff identified by apron or counter position only.</div>
</aside>

<div class="legend">
  <span class="chip"><i style="background:#1d6b45"></i>Customer</span>
  <span class="chip"><i style="background:#111"></i>Employee (black apron)</span>
  <span class="chip"><i style="background:#c0392b"></i>Door line</span>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const host = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#efe7db");
scene.fog = new THREE.Fog("#efe7db", 40, 90);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(14, 22, 26);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(4, 0, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.maxPolarAngle = Math.PI / 2.2;

scene.add(new THREE.HemisphereLight("#fff8ec", "#8a8175", 1.1));
const sun = new THREE.DirectionalLight("#ffffff", 1.4);
sun.position.set(10, 25, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25 });
scene.add(sun);

const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, ...o });
function box(w, h, d, color, x, y, z, o) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, o));
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}

// Restaurant shell: 20 x 14 floor, door on the front wall (z = +7)
const W = 20, D = 14;
box(W, 0.2, D, "#d9c7a8", 0, -0.1, 0);                          // wood floor
box(W + 8, 0.1, 8, "#bdb6a8", 0, -0.15, D / 2 + 4);            // sidewalk outside
box(W, 3, 0.3, "#fffdf8", 0, 1.5, -D / 2);                       // back wall
box(0.3, 3, D, "#f3ecdf", -W / 2, 1.5, 0);                       // left wall
box(0.3, 3, D, "#f3ecdf", W / 2, 1.5, 0);                        // right wall
box(7, 3, 0.3, "#f3ecdf", -6.5, 1.5, D / 2);                     // front wall, left of door
box(7, 3, 0.3, "#f3ecdf", 6.5, 1.5, D / 2);                      // front wall, right of door
box(6, 0.6, 0.3, "#f3ecdf", 0, 2.7, D / 2);                      // over the door
const doorLine = box(6, 0.04, 0.12, "#c0392b", 0, 0.03, D / 2 - 0.4, { emissive: "#c0392b", emissiveIntensity: 0.6 });

// Counter with kitchen zone behind it
box(10, 1.1, 1.2, "#8d3d14", 4, 0.55, -3.5);                     // counter
box(10.2, 0.1, 1.4, "#2b2b2b", 4, 1.15, -3.5);                   // counter top
box(10, 0.02, 2.6, "#e9dccb", 4, 0.01, -5.6);                    // behind-counter zone
box(1.2, 0.5, 0.8, "#444", 6, 1.45, -3.5);                       // register

// Tables + stools
for (const [x, z] of [[-6, -2], [-6, 3], [-1, 3], [-1, -1]]) {
  box(1.8, 0.1, 1.8, "#6e3012", x, 1, z);
  box(0.2, 1, 0.2, "#3b2a1e", x, 0.5, z);
  for (const [dx, dz] of [[1.3, 0], [-1.3, 0], [0, 1.3], [0, -1.3]]) {
    const s = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.6, 16), mat("#17211c"));
    s.position.set(x + dx, 0.3, z + dz); s.castShadow = true; scene.add(s);
  }
}

// Sign over the door
const canvas = document.createElement("canvas"); canvas.width = 512; canvas.height = 96;
const g = canvas.getContext("2d");
g.fillStyle = "#17211c"; g.fillRect(0, 0, 512, 96);
g.fillStyle = "#fffdf8"; g.font = "600 48px Palatino Linotype, Georgia, serif"; g.textAlign = "center";
g.fillText("LLMSoftware Café", 256, 64);
const sign = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) }));
sign.position.set(0, 3.6, D / 2 + 0.2); scene.add(sign);

// People: capsule body + head; employees wear a black apron
function person(employee) {
  const grp = new THREE.Group();
  const shirt = employee ? "#f3ecdf" : ["#1d6b45", "#2e6da4", "#b5651d", "#7a4a9e"][Math.floor(Math.random() * 4)];
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.9, 6, 12), mat(shirt));
  body.position.y = 0.85; body.castShadow = true; grp.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), mat("#d8b48c"));
  head.position.y = 1.75; head.castShadow = true; grp.add(head);
  if (employee) {
    const apron = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.95, 0.12), mat("#0d0d0d", { roughness: 0.5 }));
    apron.position.set(0, 0.75, 0.33); grp.add(apron);
    const strap = new THREE.Mesh(new THREE.TorusGeometry(0.37, 0.03, 6, 24), mat("#0d0d0d"));
    strap.rotation.x = Math.PI / 2; strap.position.y = 0.95; grp.add(strap);
  }
  scene.add(grp);
  return grp;
}

const rand = (a, b) => a + Math.random() * (b - a);
const insideSpot = () => new THREE.Vector3(rand(-8, 8), 0, rand(-1.8, 5.5));
const staffSpot = () => new THREE.Vector3(rand(0, 8), 0, rand(-6.3, -4.8));
const DOOR_IN = new THREE.Vector3(0, 0, D / 2 - 1), DOOR_OUT = new THREE.Vector3(0, 0, D / 2 + 5);

const customers = [], staff = [];
function addCustomer(fromDoor) {
  const p = person(false);
  p.position.copy(fromDoor ? DOOR_OUT : insideSpot());
  p.userData = { path: fromDoor ? [DOOR_IN, insideSpot()] : [insideSpot()], leaving: false };
  customers.push(p);
}
function removeCustomer() {
  const p = customers.find(c => !c.userData.leaving);
  if (!p) return;
  p.userData.leaving = true;
  p.userData.path = [DOOR_IN.clone(), DOOR_OUT.clone().add(new THREE.Vector3(rand(-6, 6), 0, 1))];
}
function syncStaff(n) {
  while (staff.length < n) { const s = person(true); s.position.copy(staffSpot()); s.userData = { path: [staffSpot()] }; staff.push(s); }
  while (staff.length > n) scene.remove(staff.pop());
}

function step(p, dt, speed) {
  const target = p.userData.path[0];
  if (!target) return true;
  const d = target.clone().sub(p.position); d.y = 0;
  if (d.length() < 0.1) { p.userData.path.shift(); return p.userData.path.length === 0; }
  d.setLength(Math.min(d.length(), speed * dt));
  p.position.add(d);
  p.rotation.y = Math.atan2(d.x, d.z);
  p.position.y = Math.abs(Math.sin(performance.now() / 120)) * 0.06;
  return false;
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const c of [...customers]) {
    if (step(c, dt, 2.2)) {
      if (c.userData.leaving) { scene.remove(c); customers.splice(customers.indexOf(c), 1); }
      else if (Math.random() < 0.004) c.userData.path = [insideSpot()];
    }
  }
  for (const s of staff) if (step(s, dt, 1.4) && Math.random() < 0.01) s.userData.path = [staffSpot()];
  doorLine.material.emissiveIntensity = 0.4 + Math.abs(Math.sin(performance.now() / 400)) * 0.6;
  controls.update();
  renderer.render(scene, camera);
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Live data from events.log via dashboard.py
let shown = null;
const $ = id => document.getElementById(id);
async function poll() {
  try {
    const s = await (await fetch("/api/state")).json();
    for (const k of ["in_store", "came_in", "left", "employees"]) $(k).textContent = s[k];
    const active = customers.filter(c => !c.userData.leaving).length;
    if (shown === null) { for (let i = 0; i < s.in_store; i++) addCustomer(false); }
    else { for (let i = active; i < s.in_store; i++) addCustomer(true); for (let i = s.in_store; i < active; i++) removeCustomer(); }
    shown = s.in_store;
    syncStaff(s.employees);
    $("log").innerHTML = s.log.length ? s.log.slice().reverse().map(l => {
      const cls = l.includes("ALERT") ? "alrt" : l.includes("came in") ? "in" : l.includes(" left") ? "out" : "";
      return `<div class="${cls}">${l.replace(/</g, "&lt;")}</div>`;
    }).join("") : "<div>Waiting for events from main.py…</div>";
    $("alerts").innerHTML = s.alerts.slice(-1).map(a => `<div class="alert">${a.replace(/</g, "&lt;")}</div>`).join("");
  } catch (e) { /* dashboard keeps rendering if the server blips */ }
}
poll(); setInterval(poll, 1000);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In-N-Out</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --text:#e6edf3; --dim:#8b949e;
          --green:#3fb950; --yellow:#d29922; --red:#f85149; --cyan:#39c5cf; --orange:#ff9f43; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, Segoe UI, sans-serif;
         height:100vh; display:grid; grid-template-rows:auto auto 1fr; gap:12px; padding:12px; }
  header { display:flex; align-items:center; gap:16px; }
  header h1 { font-size:20px; margin:0; letter-spacing:.3px; }
  header .live { color:var(--red); font-weight:700; font-size:12px; }
  header .live::before { content:"● "; }
  header button { margin-left:auto; background:var(--panel); color:var(--text); border:1px solid var(--line);
                  border-radius:6px; padding:6px 12px; cursor:pointer; }
  .counters { display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; }
  .card .n { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; }
  .card .l { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  .main { display:grid; grid-template-columns:1.25fr 1fr; grid-template-rows:minmax(0,1.1fr) minmax(0,1fr);
          gap:12px; min-height:0; }
  .video { grid-column:1; grid-row:1; }
  .log { grid-column:2; grid-row:1; }
  .three { grid-column:1 / span 2; grid-row:2; justify-self:center; width:min(100%, 1100px); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden;
           display:flex; flex-direction:column; min-height:0; }
  .panel h2 { margin:0; padding:8px 12px; font-size:12px; color:var(--dim); text-transform:uppercase;
              letter-spacing:.6px; border-bottom:1px solid var(--line); }
  .cam-h { display:flex; align-items:center; gap:10px; }
  .ctl { margin-left:auto; display:flex; align-items:center; gap:8px; text-transform:none; letter-spacing:0; }
  .ctl button { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:5px;
                padding:2px 8px; font-size:11px; cursor:pointer; }
  .ctl button:hover { border-color:var(--dim); }
  .ctl input[type=range] { width:120px; accent-color:var(--red); }
  #l-pct { min-width:32px; font-variant-numeric:tabular-nums; color:var(--text); }
  .video img { width:100%; height:100%; object-fit:contain; background:#000; min-height:0; flex:1; }
  #log { margin:0; padding:10px 12px; overflow:auto; flex:1; font:12.5px/1.6 ui-monospace, Consolas, monospace;
         white-space:pre; }
  #log .in { color:var(--green); } #log .out { color:var(--yellow); } #log .alert { color:var(--red); font-weight:700; }
  #log .ai { color:var(--cyan); } #log .emp { color:var(--orange); }
  .three iframe { border:0; width:100%; flex:1; background:#000; }
  .three .empty { flex:1; display:grid; place-items:center; color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>In-N-Out</h1><span class="live">LIVE</span>
  <span style="color:var(--dim)">Who's coming, who's leaving</span>
  <button id="sum">AI shift summary</button>
</header>

<section class="counters">
  <div class="card"><div class="n" id="c-in_store">0</div><div class="l">Customers in store</div></div>
  <div class="card"><div class="n" id="c-came_in">0</div><div class="l">Came in</div></div>
  <div class="card"><div class="n" id="c-left">0</div><div class="l">Left</div></div>
  <div class="card"><div class="n" id="c-employees">0</div><div class="l">Employees on floor</div></div>
  <div class="card"><div class="n" id="c-emp_in">0</div><div class="l">Staff came in</div></div>
  <div class="card"><div class="n" id="c-emp_out">0</div><div class="l">Staff left</div></div>
</section>

<section class="main">
  <div class="panel video"><h2 class="cam-h">Camera
    <span class="ctl">
      <span>Door line</span>
      <button id="l-axis" type="button" title="Switch horizontal / vertical">Horizontal</button>
      <input id="l-pos" type="range" min="5" max="95" value="50" aria-label="Door line position">
      <span id="l-pct">50%</span>
      <button id="l-inv" type="button" title="Swap which side is inside">Swap in/out</button>
    </span></h2><img id="cam" src="/frame.jpg" alt="Live camera"></div>
  <div class="panel log"><h2>Event log</h2><pre id="log"></pre></div>
  <div class="panel three"><h2>3D store view</h2><div id="three-slot" class="empty"><div>
    Add <code>?three=http://localhost:PORT</code> to this page's URL to show the 3D model</div></div></div>
</section>

<script>
  const three = new URLSearchParams(location.search).get("three");
  if (three) {
    const slot = document.getElementById("three-slot");
    const f = document.createElement("iframe"); f.src = three; slot.replaceWith(f);
  }
  const cls = l => l.includes("ALERT") ? "alert" : l.includes("AI-verified") ? "ai"
    : l.includes("EMPLOYEE #") ? "emp" : l.includes("came in") ? "in" : l.includes(" left") ? "out" : "";
  const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  let last = "";
  async function tick() {
    try {
      const s = await (await fetch("/state", {cache: "no-store"})).json();
      for (const [k, v] of Object.entries(s.counts || {})) {
        const el = document.getElementById("c-" + k); if (el) el.textContent = v;
      }
      const html = (s.log || []).map(l => `<span class="${cls(l)}">${esc(l)}</span>`).join("\n");
      if (html !== last) { const el = document.getElementById("log"); el.innerHTML = html; el.scrollTop = el.scrollHeight; last = html; }
    } catch (e) {}
  }
  setInterval(tick, 300); tick();
  // Camera: pull the latest frame back-to-back; survives app restarts (no long-lived stream).
  const cam = document.getElementById("cam");
  function nextFrame() {
    const img = new Image();
    img.onload = () => { cam.src = img.src; setTimeout(nextFrame, 30); };
    img.onerror = () => setTimeout(nextFrame, 500);
    img.src = "/frame.jpg?t=" + Date.now();
  }
  nextFrame();
  document.getElementById("sum").onclick = () => fetch("/summary");

  // Door-line controls -> /config (main.py reads it every frame)
  const lAxis = document.getElementById("l-axis"), lPos = document.getElementById("l-pos"),
        lPct = document.getElementById("l-pct"), lInv = document.getElementById("l-inv");
  let line = null, dragging = false;
  function showLine(c) {
    line = c;
    lAxis.textContent = c.axis === "x" ? "Vertical" : "Horizontal";
    if (!dragging) lPos.value = Math.round(c.pos * 100);
    lPct.textContent = Math.round(c.pos * 100) + "%";
    lInv.style.borderColor = c.invert ? "var(--orange)" : "";
  }
  async function setLine(q) {
    try { showLine(await (await fetch("/config?" + new URLSearchParams(q), {cache: "no-store"})).json()); } catch (e) {}
  }
  lAxis.onclick = () => setLine({axis: line && line.axis === "x" ? "y" : "x"});
  lInv.onclick = () => setLine({invert: line && line.invert ? "0" : "1"});
  lPos.oninput = () => { dragging = true; lPct.textContent = lPos.value + "%"; setLine({pos: lPos.value / 100}); };
  lPos.onchange = () => { dragging = false; };
  setLine({});
</script>
</body>
</html>
